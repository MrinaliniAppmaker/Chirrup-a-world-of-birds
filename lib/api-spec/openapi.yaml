openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /birds/generate:
    post:
      operationId: generateBird
      tags: [birds]
      summary: Generate an imagined bird from selected traits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BirdTraits"
      responses:
        "200":
          description: Generated bird portrait and field notes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedBird"
        "400":
          description: Invalid traits
        "429":
          description: Generation is busy
        "502":
          description: AI generation failed
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    BirdTraits:
      type: object
      required: [body, beak, colors, feathers, legs, feet]
      properties:
        body: { type: string, maxLength: 120 }
        beak: { type: string, maxLength: 120 }
        colors: { type: string, maxLength: 120 }
        feathers: { type: string, maxLength: 120 }
        legs: { type: string, maxLength: 120 }
        feet: { type: string, maxLength: 120 }
        extra: { type: string, maxLength: 500 }
    GeneratedBird:
      type: object
      required: [id, name, scientificName, tagline, appearance, habitat, diet, behavior, imageUri, createdAt, traits]
      properties:
        id: { type: string }
        name: { type: string }
        scientificName: { type: string }
        tagline: { type: string }
        appearance: { type: string }
        habitat: { type: string }
        diet: { type: string }
        behavior: { type: string }
        imageUri: { type: string }
        createdAt: { type: string }
        traits:
          $ref: "#/components/schemas/BirdTraits"
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

