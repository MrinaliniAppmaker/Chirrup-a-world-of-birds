openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /legal/privacy:
    get:
      operationId: getPublicPrivacyPolicy
      summary: Public pre-release privacy policy HTML, accessible without authentication
      responses:
        "200":
          description: Public privacy draft
          content:
            text/html:
              schema:
                type: string
  /legal/delete-account:
    get:
      operationId: getPublicAccountDeletion
      summary: Public instructions and email composition link for manual account-deletion requests
      responses:
        "200":
          description: Account-deletion request instructions; this GET never deletes data
          content:
            text/html:
              schema:
                type: string
  /bird-shares/batch:
    post:
      operationId: createBirdShareBatch
      summary: Create one seven-day link for selected saved birds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BirdShareSelection"
      responses:
        "201":
          description: Link authorizing only the selected birds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BirdShareLink"
        "400": { description: Select between 1 and 100 distinct birds }
        "401": { description: Sign in required }
        "404": { description: A selected bird is not in your journal }
  /bird-shares/import-batch:
    post:
      operationId: importBirdShareBatch
      summary: Import all shared birds atomically or import none if capacity is insufficient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BirdShareClaim"
      responses:
        "200":
          description: Independent copies including existing copies on retry
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeneratedBird"
        "401": { description: Sign in required }
        "404": { description: Link unavailable }
        "409": { description: Not enough free library spaces for the selected birds }
  /bird-shares:
    post:
      operationId: createBirdShare
      summary: Create a seven-day link to one bird in the signed-in account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BirdShareInput"
      responses:
        "201":
          description: Anyone holding the link may preview and import this bird
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BirdShareLink"
        "400": { description: Invalid bird identifier }
        "401": { description: Sign in required }
        "404": { description: Bird not found in your journal }
  /bird-shares/preview:
    get:
      operationId: previewBirdShare
      summary: Preview only the bird authorized by a sharing token
      parameters:
        - $ref: "#/components/parameters/BirdShareToken"
      responses:
        "200":
          description: Shared bird and link expiration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedBirdPreview"
        "404": { description: "Link invalid, expired, or source bird removed" }
  /bird-shares/import:
    post:
      operationId: importBirdShare
      summary: Add an independent exact copy to the signed-in account without replacing any bird
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BirdShareClaim"
      responses:
        "200":
          description: Imported bird or the previously imported copy on retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedBird"
        "401": { description: Sign in required }
        "404": { description: "Link invalid, expired, or source bird removed" }
        "409": { description: Library holds 100 birds already }
  /bird-shares/open:
    get:
      operationId: openBirdShare
      summary: Email landing page with an app button and a copyable link
      parameters:
        - $ref: "#/components/parameters/BirdShareToken"
      responses:
        "200":
          description: Sharing instructions
          content:
            text/html:
              schema: { type: string }
        "404": { description: Link invalid or expired }
  /journal/profile:
    patch:
      operationId: renameAccountProfile
      summary: Rename only the signed-in user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileName"
      responses:
        "200":
          description: Updated profile name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileName"
        "401":
          description: Sign in required
  /journal/account:
    get:
      operationId: getAccountJournal
      summary: Open the signed-in account journal
      responses:
        "200":
          description: Account journal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalAccount"
        "401":
          description: Sign in required
  /journal/claim:
    post:
      operationId: claimJournal
      summary: Transfer an installation journal to the signed-in account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalClaim"
      responses:
        "200":
          description: Journal transferred without changing portraits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalAccount"
        "401":
          description: Sign in required
        "409":
          description: Already claimed or exceeds journal capacity
  /journal/installations:
    post:
      operationId: registerJournalInstallation
      summary: Create a private journal for this app installation
      responses:
        "201":
          description: Store this credential on the device; it is not recoverable without an account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalInstallation"
  /journal/birds:
    get:
      operationId: listJournalBirds
      security: [{ journalDevice: [] }]
      summary: List this installation's saved birds
      responses:
        "200":
          description: Saved birds with temporary authorized portrait URLs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeneratedBird"
    post:
      operationId: saveJournalBird
      security: [{ journalDevice: [] }]
      summary: Save a journal bird after uploading its portrait
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalBirdInput"
      responses:
        "200":
          description: Saved bird; repeated saves of the same ID are idempotent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedBird"
        "409":
          description: Journal holds 100 birds
  /journal/portraits:
    post:
      operationId: requestJournalPortrait
      security: [{ journalDevice: [] }]
      summary: Authorize direct upload of a generated journal portrait
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalPortraitInput"
      responses:
        "200":
          description: Private portrait path and short-lived direct upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalPortraitUpload"
  /journal/birds/{birdId}:
    delete:
      operationId: deleteJournalBird
      security: [{ journalDevice: [] }]
      summary: Remove only this installation's saved bird
      parameters:
        - name: birdId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$' }
      responses:
        "204":
          description: Bird removed or already absent from this installation
  /birds/interact:
    post:
      operationId: simulateEncounter
      tags: [birds]
      summary: Imagine a five-minute encounter between selected birds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EncounterRequest"
      responses:
        "200":
          description: Shared habitat image and minute-by-minute imagined account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedEncounter"
        "400":
          description: Select between two and six birds
        "429":
          description: Studio is busy
        "502":
          description: Encounter generation failed
  /birds/validate-traits:
    post:
      operationId: checkBirdTraits
      tags: [birds]
      summary: Check bird features before opening the review screen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BirdTraits"
      responses:
        "200":
          description: Validation result with exact offending text ranges
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BirdTraitCheck"
        "400":
          description: Missing or unreadable traits
        "429":
          description: Too many checks
        "502":
          description: Trait validation is temporarily unavailable
  /birds/generate:
    post:
      operationId: generateBird
      tags: [birds]
      summary: Generate an imagined bird from selected traits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BirdTraits"
      responses:
        "200":
          description: Generated bird portrait and field notes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedBird"
        "400":
          description: Invalid traits
        "429":
          description: Generation is busy
        "502":
          description: AI generation failed
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  parameters:
    BirdShareToken:
      in: query
      name: token
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
  securitySchemes:
    journalDevice:
      type: http
      scheme: bearer
      description: Random installation credential, never a phone hardware identifier.
  schemas:
    BirdShareSelection:
      type: object
      additionalProperties: false
      required: [birdIds]
      properties:
        birdIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$' }
    BirdShareInput:
      type: object
      additionalProperties: false
      required: [birdId]
      properties:
        birdId: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$' }
    BirdShareClaim:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
    BirdShareLink:
      type: object
      required: [token, expiresAt]
      properties:
        token: { type: string }
        expiresAt: { type: string }
    SharedBirdPreview:
      type: object
      required: [bird, expiresAt]
      properties:
        birds:
          type: array
          items:
            $ref: "#/components/schemas/GeneratedBird"
        bird:
          $ref: "#/components/schemas/GeneratedBird"
        expiresAt: { type: string }
    ProfileName:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 60
    JournalAccount:
      type: object
      required: [installationId]
      properties:
        installationId:
          type: string
          format: uuid
    JournalClaim:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 64
          maxLength: 64
    JournalInstallation:
      type: object
      required: [installationId, token]
      properties:
        installationId: { type: string }
        token: { type: string }
    JournalPortraitInput:
      type: object
      required: [birdId, contentType, byteLength]
      properties:
        birdId: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$' }
        contentType: { type: string, enum: [image/png, image/jpeg, image/webp] }
        byteLength: { type: integer, minimum: 1, maximum: 8388608 }
    JournalPortraitUpload:
      type: object
      required: [uploadUrl, portraitPath]
      properties:
        uploadUrl: { type: string }
        portraitPath: { type: string, maxLength: 350 }
    JournalBirdInput:
      type: object
      required: [bird, portraitPath]
      properties:
        bird:
          $ref: "#/components/schemas/GeneratedBird"
        portraitPath: { type: string, minLength: 1, maxLength: 350 }
    EncounterRequest:
      type: object
      required: [birds]
      properties:
        birds:
          type: array
          minItems: 2
          maxItems: 6
          items:
            $ref: "#/components/schemas/EncounterBird"
    EncounterBird:
      type: object
      required: [id, name, traits, appearance, habitat, diet, behavior, referenceImage]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        name: { type: string, maxLength: 100 }
        traits:
          $ref: "#/components/schemas/BirdTraits"
        appearance: { type: string, maxLength: 2000 }
        habitat: { type: string, maxLength: 2000 }
        diet: { type: string, maxLength: 2000 }
        behavior: { type: string, maxLength: 2000 }
        referenceImage:
          type: string
          description: The saved portrait as an inline image, used to preserve this individual bird's visual identity.
          maxLength: 1400000
          pattern: '^data:image/(jpeg|png|webp);base64,[A-Za-z0-9+/]+={0,2}$'
    GeneratedEncounter:
      type: object
      required: [title, habitat, summary, imageUri, minutes]
      properties:
        title: { type: string }
        habitat: { type: string }
        summary: { type: string }
        imageUri: { type: string }
        minutes:
          type: array
          minItems: 5
          maxItems: 5
          items:
            type: object
            required: [minute, title, description]
            properties:
              minute: { type: integer, minimum: 1, maximum: 5 }
              title: { type: string }
              description: { type: string }
    BirdTraits:
      type: object
      required: [body, beak, colors, feathers, legs, feet]
      properties:
        body: { type: string, maxLength: 120 }
        beak: { type: string, maxLength: 120 }
        colors: { type: string, maxLength: 120 }
        feathers: { type: string, maxLength: 120 }
        legs: { type: string, maxLength: 120 }
        feet: { type: string, maxLength: 120 }
        extra: { type: string, maxLength: 500 }
    BirdTraitIssue:
      type: object
      required: [field, feature, start, end]
      properties:
        field:
          type: string
          enum: [body, beak, colors, feathers, legs, feet, extra]
        feature: { type: string }
        start: { type: integer, minimum: 0 }
        end: { type: integer, minimum: 1 }
    BirdTraitCheck:
      type: object
      required: [valid, message, issues]
      properties:
        valid: { type: boolean }
        message: { type: string }
        issues:
          type: array
          items:
            $ref: "#/components/schemas/BirdTraitIssue"
    GeneratedBird:
      type: object
      required: [id, name, scientificName, tagline, appearance, habitat, diet, behavior, imageUri, createdAt, traits]
      properties:
        id: { type: string }
        name: { type: string }
        scientificName: { type: string }
        tagline: { type: string }
        appearance: { type: string }
        habitat: { type: string }
        diet: { type: string }
        behavior: { type: string }
        imageUri: { type: string }
        createdAt: { type: string }
        traits:
          $ref: "#/components/schemas/BirdTraits"
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

